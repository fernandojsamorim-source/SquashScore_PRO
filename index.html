<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquashScore_PRO - Placar ao Vivo</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Digital Font for Scoreboard Numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-bg: #050505;
            --color-panel: #111111;
            --color-score-red: #ff3333;
            --color-score-green: #33ff33;
            --color-text-main: #ffffff;
            --color-text-dim: #888888;
            --color-accent: #00aaff;
            --color-gold: #ffaa00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* PANORAMIC HEADER */
        header {
            background-color: var(--color-panel);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            border-bottom: 2px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--color-accent);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .room-info {
            font-size: 1.2rem;
            color: var(--color-gold);
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* MAIN SCOREBOARD AREA */
        .scoreboard-container {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            gap: 20px;
        }

        .player-column {
            flex: 1;
            background: var(--color-panel);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 1px solid #333;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            height: 80%;
        }

        .player-name {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        .score-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 14rem;
            line-height: 1;
            text-shadow: 0 0 20px currentColor;
        }

        #player1-column .score-display { color: var(--color-score-red); }
        #player2-column .score-display { color: var(--color-score-green); }

        /* CENTER AREA */
        .center-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 200px;
        }

        .game-badge {
            background: var(--color-gold);
            color: #000;
            font-weight: 900;
            font-size: 2rem;
            padding: 10px 30px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.4);
        }

        .sets-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            color: var(--color-text-main);
        }

        /* LEADERBOARD FOOTER */
        .leaderboard-container {
            background-color: var(--color-panel);
            border-top: 2px solid #222;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .leaderboard-title {
            font-size: 1.2rem;
            color: var(--color-text-dim);
            text-transform: uppercase;
            font-weight: bold;
            margin-right: 10px;
        }

        .leaderboard-players {
            display: flex;
            flex: 1;
            gap: 15px;
            overflow-x: auto;
        }

        .player-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }

        .card-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--color-accent);
            margin-bottom: 5px;
        }

        .card-stats {
            font-size: 1rem;
            color: var(--color-text-main);
        }

        .card-stats span {
            color: var(--color-text-dim);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>SquashScore PRO</h1>
        <div id="room-info" class="room-info">SALA: ---</div>
    </header>

    <div class="scoreboard-container">
        <!-- Player 1 -->
        <div id="player1-column" class="player-column">
            <div id="player1-name" class="player-name">JOGADOR 1</div>
            <div id="score1" class="score-display">0</div>
        </div>

        <!-- Center (Games / Sets) -->
        <div class="center-info">
            <div class="game-badge">Game <span id="current-game">1</span></div>
            <div class="sets-score"><span id="wins1">0</span> - <span id="wins2">0</span></div>
        </div>

        <!-- Player 2 -->
        <div id="player2-column" class="player-column">
            <div id="player2-name" class="player-name">JOGADOR 2</div>
            <div id="score2" class="score-display">0</div>
        </div>
    </div>

    <!-- Leaderboard Footer -->
    <div class="leaderboard-container">
        <div class="leaderboard-title">CLASSIFICAÇÃO:</div>
        <div id="leaderboard-players" class="leaderboard-players">
            <div class="player-card" style="opacity: 0.5;">A aguardar dados...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tosgwsmypmxkzhhaofqi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_d6LnSuBPvS0Yl1mPCdDOlQ_kGd4xF-M';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const urlParams = new URLSearchParams(window.location.search);
        const roomPin = urlParams.get('sala');

        if (!roomPin) {
            document.getElementById('room-info').innerText = "ERRO: SEM SALA";
        } else {
            document.getElementById('room-info').innerText = `SALA: #${roomPin}`;
            loadRoomData(roomPin);
            subscribeRealtime(roomPin);
        }

        async function loadRoomData(pin) {
            const { data, error } = await supabaseClient.from('live_sessions').select('*').eq('pin', pin).single();
            if (data) updateUI(data);
        }

        function subscribeRealtime(pin) {
            supabaseClient
                .channel('public:live_sessions')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'live_sessions', filter: `pin=eq.${pin}` }, 
                (payload) => updateUI(payload.new))
                .subscribe();
        }

        function updateUI(data) {
            document.getElementById('score1').innerText = data.score1 || 0;
            document.getElementById('score2').innerText = data.score2 || 0;
            document.getElementById('wins1').innerText = data.wins1 || 0;
            document.getElementById('wins2').innerText = data.wins2 || 0;
            document.getElementById('current-game').innerText = data.current_game || 1;
            
            const courtPlayers = data.court_players || [];
            if (courtPlayers.length > 0 && courtPlayers[0]) document.getElementById('player1-name').innerText = courtPlayers[0];
            if (courtPlayers.length > 1 && courtPlayers[1]) document.getElementById('player2-name').innerText = courtPlayers[1];

            const stats = data.player_stats || [];
            const leaderboardContainer = document.getElementById('leaderboard-players');
            
            if (stats.length > 0) {
                leaderboardContainer.innerHTML = '';
                stats.sort((a, b) => b.wins - a.wins || b.points - a.points);

                stats.forEach(player => {
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                        <div class="card-name">${player.name}</div>
                        <div class="card-stats">${player.wins} <span>Vitórias</span> | ${player.points} <span>Pts</span></div>
                    `;
                    leaderboardContainer.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>
